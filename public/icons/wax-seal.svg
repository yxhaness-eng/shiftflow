<svg width="512" height="512" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Soft Drop Shadow -->
    <filter id="sealShadow" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#120407" flood-opacity="0.6"/>
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.35"/>
    </filter>

    <!-- Inner Stamp Shadow -->
    <filter id="innerBevel" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="3" result="blur"/>
      <feOffset dx="-2" dy="-2" result="offset1"/>
      <feOffset dx="2" dy="3" result="offset2"/>
      <feComposite in="offset2" in2="SourceAlpha" operator="arithmetic" k2="-1" k3="1" result="shadowDiff"/>
      <feFlood flood-color="#1A0408" flood-opacity="0.75" result="shadowColor"/>
      <feComposite in="shadowColor" in2="shadowDiff" operator="in" result="innerShadow"/>
      <feComposite in="SourceGraphic" in2="innerShadow" operator="over"/>
    </filter>

    <!-- Deep Burgundy Wax Gradients -->
    <radialGradient id="waxBase" cx="38%" cy="32%" r="68%">
      <stop offset="0%" stop-color="#911D32"/>
      <stop offset="35%" stop-color="#721424"/>
      <stop offset="70%" stop-color="#4E0C17"/>
      <stop offset="100%" stop-color="#2D060D"/>
    </radialGradient>

    <radialGradient id="waxInnerWell" cx="42%" cy="38%" r="60%">
      <stop offset="0%" stop-color="#781728"/>
      <stop offset="65%" stop-color="#520D1A"/>
      <stop offset="100%" stop-color="#34070F"/>
    </radialGradient>

    <linearGradient id="waxRimHighlight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#C23B56" stop-opacity="0.7"/>
      <stop offset="40%" stop-color="#80192A" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#1A0307" stop-opacity="0.8"/>
    </linearGradient>

    <!-- Antique Gold Foil Gradient -->
    <linearGradient id="antiqueGold" x1="20%" y1="10%" x2="80%" y2="90%">
      <stop offset="0%" stop-color="#FFF4D0"/>
      <stop offset="25%" stop-color="#F2DB94"/>
      <stop offset="50%" stop-color="#DFBA67"/>
      <stop offset="75%" stop-color="#C7983E"/>
      <stop offset="100%" stop-color="#E9CD7F"/>
    </linearGradient>

    <!-- Gold Shimmer Highlight -->
    <linearGradient id="goldGlint" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFEAA7" stop-opacity="0.2"/>
      <stop offset="50%" stop-color="#FFFFFF" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#FFEAA7" stop-opacity="0.2"/>
    </linearGradient>

    <!-- Delicate Cream Paper for Journal Pages -->
    <linearGradient id="journalPaper" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFDF9"/>
      <stop offset="50%" stop-color="#FAF4EB"/>
      <stop offset="100%" stop-color="#F1E4D0"/>
    </linearGradient>
  </defs>

  <!-- 1. Outer Wax Seal Blob (Organic melted sealing wax edges) -->
  <g filter="url(#sealShadow)">
    <path d="
      M 256,26 
      C 292,23 328,34 358,54 
      C 390,75 422,96 443,128 
      C 466,162 479,203 483,244 
      C 487,285 474,328 454,362 
      C 432,398 402,429 366,450 
      C 330,471 289,484 248,485 
      C 207,486 166,473 131,452 
      C 95,431 66,400 48,363 
      C 29,326 24,283 27,242 
      C 30,201 47,161 71,128 
      C 95,95 130,71 169,53 
      C 197,40 227,29 256,26 Z"
      fill="url(#waxBase)"
    />
    <!-- Wax surface highlight sheen -->
    <path d="
      M 256,26 
      C 292,23 328,34 358,54 
      C 390,75 422,96 443,128 
      C 466,162 479,203 483,244 
      C 487,285 474,328 454,362 
      C 432,398 402,429 366,450 
      C 330,471 289,484 248,485 
      C 207,486 166,473 131,452 
      C 95,431 66,400 48,363 
      C 29,326 24,283 27,242 
      C 30,201 47,161 71,128 
      C 95,95 130,71 169,53 
      C 197,40 227,29 256,26 Z"
      fill="url(#waxRimHighlight)"
    />
  </g>

  <!-- 2. Pressed Wax Center Well -->
  <circle cx="256" cy="256" r="198" fill="url(#waxInnerWell)" stroke="#1F0409" stroke-width="4"/>
  
  <!-- Outer Dotted Seal Ring in Embossed Gold -->
  <circle cx="256" cy="256" r="186" fill="none" stroke="url(#antiqueGold)" stroke-width="2.5" stroke-dasharray="3 6" opacity="0.85"/>
  <circle cx="256" cy="256" r="176" fill="none" stroke="url(#antiqueGold)" stroke-width="3" opacity="0.95"/>
  <circle cx="256" cy="256" r="168" fill="none" stroke="#25050C" stroke-width="1.5" opacity="0.6"/>

  <!-- 3. Botanical Laurel Wreath & Delicate Gold Floral Sprigs -->
  <g fill="url(#antiqueGold)" opacity="0.95">
    <!-- Left Laurel Branch -->
    <path d="M 128,260 C 128,190 172,130 236,108 C 233,115 230,124 233,132 C 220,131 206,138 200,150 C 190,147 178,154 174,166 C 160,166 148,177 146,192 C 136,198 130,212 133,225 C 124,236 125,250 131,262 C 128,260 128,260 128,260 Z"/>
    <!-- Left Leaves -->
    <path d="M 148,142 C 160,135 174,142 172,156 C 160,158 147,152 148,142 Z"/>
    <path d="M 126,182 C 140,178 152,187 148,201 C 136,201 126,193 126,182 Z"/>
    <path d="M 118,228 C 132,226 142,238 136,251 C 124,249 116,240 118,228 Z"/>
    <path d="M 124,276 C 137,277 144,291 136,303 C 125,299 120,287 124,276 Z"/>
    <path d="M 144,324 C 156,328 160,344 149,354 C 139,348 137,334 144,324 Z"/>
    <path d="M 178,366 C 190,373 190,390 177,398 C 168,389 170,375 178,366 Z"/>

    <!-- Right Laurel Branch -->
    <path d="M 384,260 C 384,190 340,130 276,108 C 279,115 282,124 279,132 C 292,131 306,138 312,150 C 322,147 334,154 338,166 C 352,166 364,177 366,192 C 376,198 382,212 379,225 C 388,236 387,250 381,262 C 384,260 384,260 384,260 Z"/>
    <!-- Right Leaves -->
    <path d="M 364,142 C 352,135 338,142 340,156 C 352,158 365,152 364,142 Z"/>
    <path d="M 386,182 C 372,178 360,187 364,201 C 376,201 386,193 386,182 Z"/>
    <path d="M 394,228 C 380,226 370,238 376,251 C 388,249 396,240 394,228 Z"/>
    <path d="M 388,276 C 375,277 368,291 376,303 C 387,299 392,287 388,276 Z"/>
    <path d="M 368,324 C 356,328 352,344 363,354 C 373,348 375,334 368,324 Z"/>
    <path d="M 334,366 C 322,373 322,390 335,398 C 344,389 342,375 334,366 Z"/>

    <!-- Bottom Botanical Tie / Ribbon -->
    <circle cx="256" cy="406" r="6" fill="url(#antiqueGold)"/>
    <path d="M 256,406 C 242,416 230,432 232,442 C 242,434 250,422 256,406 Z"/>
    <path d="M 256,406 C 270,416 282,432 280,442 C 270,434 262,422 256,406 Z"/>
  </g>

  <!-- 4. Centerpiece: Open Vintage Scrapbook Journal -->
  <g id="openJournal" transform="translate(0, 5)">
    <!-- Book Shadow -->
    <ellipse cx="256" cy="308" rx="86" ry="16" fill="#180307" opacity="0.6"/>

    <!-- Book Leather Cover Binding (Burgundy wine leather backing) -->
    <path d="
      M 160,284 
      C 192,288 228,296 256,312 
      C 284,296 320,288 352,284 
      L 358,212 
      C 324,216 288,224 256,238 
      C 224,224 188,216 154,212 Z"
      fill="#28050B"
      stroke="url(#antiqueGold)"
      stroke-width="2.5"
    />

    <!-- Left Open Page -->
    <path d="
      M 164,218 
      C 194,222 228,230 254,242 
      L 254,306 
      C 228,292 194,284 164,280 Z"
      fill="url(#journalPaper)"
      stroke="#4A121E"
      stroke-width="1.5"
    />

    <!-- Left Page Faint Text Lines / Scrapbook Lines -->
    <line x1="178" y1="236" x2="242" y2="248" stroke="#8C4253" stroke-width="2" stroke-linecap="round" opacity="0.65"/>
    <line x1="178" y1="248" x2="242" y2="260" stroke="#8C4253" stroke-width="2" stroke-linecap="round" opacity="0.65"/>
    <line x1="178" y1="260" x2="238" y2="272" stroke="#8C4253" stroke-width="2" stroke-linecap="round" opacity="0.65"/>
    <line x1="184" y1="272" x2="228" y2="282" stroke="#8C4253" stroke-width="2" stroke-linecap="round" opacity="0.65"/>

    <!-- Right Open Page -->
    <path d="
      M 348,218 
      C 318,222 284,230 258,242 
      L 258,306 
      C 284,292 318,284 348,280 Z"
      fill="url(#journalPaper)"
      stroke="#4A121E"
      stroke-width="1.5"
    />

    <!-- Right Page Faint Text Lines & Small Heart Stamp -->
    <line x1="270" y1="248" x2="334" y2="236" stroke="#8C4253" stroke-width="2" stroke-linecap="round" opacity="0.65"/>
    <line x1="270" y1="260" x2="334" y2="248" stroke="#8C4253" stroke-width="2" stroke-linecap="round" opacity="0.65"/>
    <line x1="274" y1="272" x2="328" y2="260" stroke="#8C4253" stroke-width="2" stroke-linecap="round" opacity="0.65"/>

    <!-- Bookmark Ribbon Hanging Down in Rose-Gold -->
    <path d="
      M 256,242 
      L 256,336 
      L 263,330 
      L 270,336 
      L 270,246 Z"
      fill="#DE4364"
      stroke="#961B36"
      stroke-width="1"
    />

    <!-- Center Spine Spine Highlight -->
    <line x1="256" y1="238" x2="256" y2="310" stroke="url(#antiqueGold)" stroke-width="2.5"/>
  </g>

  <!-- 5. Vintage Golden Feather Quill Pen Resting Diagonally Across -->
  <g id="featherQuill" transform="rotate(28, 280, 210)">
    <!-- Feather Vane Shaft -->
    <path d="
      M 276,110 
      C 278,140 274,180 268,230 
      C 265,255 260,280 256,300"
      stroke="url(#antiqueGold)"
      stroke-width="3"
      fill="none"
      stroke-linecap="round"
    />
    <!-- Feather Barbs (Upper / Outer side) -->
    <path d="
      M 276,110 
      C 285,125 304,142 308,165 
      C 310,175 302,185 292,188 
      C 305,198 300,212 284,222 
      C 292,230 286,244 274,250 
      C 270,245 268,238 268,230 Z"
      fill="url(#antiqueGold)"
      stroke="#7A182E"
      stroke-width="1.2"
    />
    <!-- Feather Barbs (Inner side) -->
    <path d="
      M 276,110 
      C 268,126 254,146 250,170 
      C 248,184 256,194 266,202 
      C 260,214 262,228 268,230 Z"
      fill="url(#antiqueGold)"
      stroke="#7A182E"
      stroke-width="1.2"
    />
    <!-- Quill Nib (Sharp brass/gold writing tip) -->
    <path d="
      M 257,295 
      L 253,316 
      L 251,318 
      L 254,302 Z"
      fill="#FFE599"
      stroke="#4A121E"
      stroke-width="0.8"
    />
  </g>

  <!-- 6. Delicate Stars & Sparkles (Magic Journal Feel) -->
  <g fill="url(#antiqueGold)">
    <!-- North Star -->
    <path d="M 256,84 Q 256,98 266,102 Q 256,106 256,120 Q 256,106 246,102 Q 256,98 256,84 Z"/>
    <circle cx="256" cy="102" r="2.5" fill="#FFFFFF"/>

    <!-- Little Sparkle Left -->
    <path d="M 188,118 Q 188,126 193,128 Q 188,130 188,138 Q 188,130 183,128 Q 188,126 188,118 Z" opacity="0.8"/>
    
    <!-- Little Sparkle Right -->
    <path d="M 324,118 Q 324,126 329,128 Q 324,130 324,138 Q 324,130 319,128 Q 324,126 324,118 Z" opacity="0.8"/>
  </g>
</svg>